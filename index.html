<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1530">
  <title>Sankofa Sanctuary</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="home" class="screen">
    <header class="hud">
      <h1 id="title" class="logo">Sankofa<span>Sanctuary</span></h1>
      <div class="hudRight">
        <div class="chip2" title="Streak"><svg viewBox="0 0 24 24"><path fill="#ffc94a" d="M12 2c1 4 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.2 1-3.5 2.2-4.5.1 2 1 3 2.3 3C11 7.5 10.5 5 12 2z"/></svg><b id="streakNum">0</b></div>
        <div class="chip2 hidden" id="leafChip" title="Rest Leaves"><svg viewBox="0 0 24 24" fill="none" stroke="#4fbf7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 11 5 20 5c0 9-5 15-13 15M5 19c3-5 6-8 10-10"/></svg><b id="leafNum">0</b></div>
        <button id="muteBtn" class="iconBtn" aria-label="Sound"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="slash" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></svg></button>
        <button id="helpBtn" class="iconBtn" aria-label="How to play"><b>?</b></button>
      </div>
    </header>
    <div class="hero">
      <div id="scene"></div>
      <div id="statePill" class="pill hidden"></div>
    </div>
    <div id="weekRow"></div>
    <div class="playBlock">
      <button id="beginBtn" class="bigBtn">Play today's puzzle</button>
      <p id="playSub"></p>
    </div>
  </section>

  <section id="puzzleScreen" class="screen hidden">
    <div id="puzzleLayout">
      <div id="refPanel">
        <img id="refImg" alt="The picture you are rebuilding">
        <div class="refText"><small>Your goal</small><b id="refName"></b><span id="progress"></span></div>
      </div>
      <div>
        <p id="puzzleHint" class="message"></p>
        <div id="boardWrap"><div id="board"></div></div>
      </div>
    </div>
    <div class="row">
      <button id="peekBtn" class="secondary hidden">Peek at goal</button>
      <button id="backBtn" class="secondary">Back</button>
    </div>
  </section>

  <section id="journalScreen" class="screen hidden">
  <div class="jHead">
    <h2>Heritage Journal</h2>
    <small id="jCount"></small>
    <div class="jBar"><i id="jBarFill"></i></div>
  </div>
  <div id="journalGrid"></div>
  <button id="journalBack" class="secondary">Home</button>
</section>

  <section id="exploreScreen" class="screen hidden">
    <div class="exHead">
      <div class="exTitle"><h2>Explore</h2></div>
      <div id="sizeSeg" class="seg">
        <button class="segBtn" data-s="3">3×3</button>
        <button class="segBtn" data-s="4">4×4</button>
        <button class="segBtn" data-s="5">5×5</button>
      </div>
      <div id="packTabs" class="packTabs"></div>
    </div>
    <div id="exList"></div>
    <button id="exBack" class="secondary">Home</button>
  </section>
  
  <div id="card" class="hidden">
    <div class="cardBox">
      <img id="cardImg" alt="">
      <h2 id="cardTitle"></h2>
      <p id="cardReward" class="reward"></p>
      <p id="cardFact"></p>
      <small id="cardSource"></small>
      <div class="row">
        <button id="shareBtn" class="secondary">Share</button>
        <button id="cardContinue">Continue</button>
      </div>
    </div>
  </div>

  <div id="tutorial" class="hidden"><div class="cardBox">
    <h2>How to play</h2>
    <p>1. Tap a tile next to the empty space to slide it.</p>
    <p>2. Rebuild the picture. No timer, no pressure.</p>
    <p>3. Learn a fact, grow your sanctuary and keep your daily streak.</p>
    <button id="tutOk">Let's go</button>
  </div></div>

  <div id="sheet" class="hidden">
    <div class="sheetBox">
      <div class="sheetHandle"></div>
      <div id="sheetImg"></div>
      <small id="sheetKicker"></small>
      <h3 id="sheetTitle"></h3>
      <p id="sheetText"></p>
      <button id="sheetBtn"></button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <nav id="tabbar">
  <button class="tab" id="tabHome" data-s="home">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 2.6 1.9 11.3a1 1 0 0 0 .65 1.76H4V20a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6.94h1.45a1 1 0 0 0 .65-1.76z"/>
      <rect x="9.5" y="14" width="5" height="8" rx="1.4" fill="#000" fill-opacity=".3"/>
    </svg>Home
  </button>
  <button class="tab" id="tabExplore" data-s="exploreScreen">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="currentColor"/>
      <circle cx="12" cy="12" r="7.6" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.2"/>
      <path d="M16.6 7.4 13.5 13.5 7.4 16.6 10.5 10.5z" fill="#000" fill-opacity=".55"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    </svg>Explore
  </button>
  <button class="tab" id="tabRace" data-s="raceMenu">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.6" y="2.4" width="2.6" height="19.6" rx="1.3" fill="currentColor"/>
      <rect x="6.2" y="3.5" width="14" height="9.6" fill="currentColor"/>
      <g fill="#000" fill-opacity=".4">
        <rect x="9.7" y="3.5" width="3.5" height="3.2"/><rect x="16.7" y="3.5" width="3.5" height="3.2"/>
        <rect x="6.2" y="6.7" width="3.5" height="3.2"/><rect x="13.2" y="6.7" width="3.5" height="3.2"/>
        <rect x="9.7" y="9.9" width="3.5" height="3.2"/><rect x="16.7" y="9.9" width="3.5" height="3.2"/>
      </g>
    </svg>Race
  </button>
  <button class="tab" id="tabJournal" data-s="journalScreen">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="2.4" width="16" height="19.2" rx="2.6" fill="currentColor"/>
      <path d="M4 5a2.6 2.6 0 0 1 2.6-2.6H8v19.2H6.6A2.6 2.6 0 0 1 4 19z" fill="#000" fill-opacity=".25"/>
      <path d="M14.6 2.4v8.2l2.2-1.7 2.2 1.7V2.4z" fill="#000" fill-opacity=".5"/>
      <rect x="10" y="14.4" width="7" height="1.9" rx=".95" fill="#000" fill-opacity=".3"/>
      <rect x="10" y="17.6" width="4.5" height="1.9" rx=".95" fill="#000" fill-opacity=".3"/>
    </svg>Journal
  </button>
</nav>

  <div id="debug" class="hidden">
    <input id="dbgDate" placeholder="YYYY-MM-DD">
    <button id="dbgSet">Set date</button>
    <button id="dbgNext">+1 day</button>
    <button id="dbgSolve">Solve now</button>
    <button id="dbgAuto">Skip: solve next day</button>
    <button id="dbgLeaf">+1 Rest Leaf</button>
    <button id="dbgCalib">Path points: off</button>
    <button id="dbgReset">Reset save</button>
    <small id="dbgInfo"></small>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="race.js"></script>
</body>
</html>
